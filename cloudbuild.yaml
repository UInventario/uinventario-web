steps:
  - id: validate-context
    name: alpine:3.22
    entrypoint: sh
    args:
      - deploy/validate-pipeline-context.sh
      - ${_DEPLOY_ENV}
      - $PROJECT_ID
      - $BRANCH_NAME

  - id: verify
    name: node:24-alpine
    entrypoint: sh
    args:
      - -ceu
      - |
        npm ci
        npm run format:check
        npm run lint
        npm run typecheck
        npm run parity:verify
        npm run architecture:verify
        npm run performance:verify
        npm run test:strategy
        npm run test:ci
        npm run test:server
        npm run build

  - id: verify-infrastructure
    name: python:3.13-alpine
    entrypoint: python
    args:
      - -m
      - py_compile
      - deploy/verify-cloud-run-scaling.py

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/web:$COMMIT_SHA
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/web:$COMMIT_SHA"
        if docker manifest inspect "$$image" >/dev/null 2>&1; then
          echo "Image already exists; reusing immutable commit tag."
        else
          docker push "$$image"
        fi

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/web:$COMMIT_SHA"
        api_upstream="$$(gcloud run services describe uinventario-api --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)' 2>/dev/null || true)"
        if [ -z "$$api_upstream" ]; then
          api_upstream="https://placeholder.invalid"
        fi
        sh deploy/cloud-run.sh "${_DEPLOY_ENV}" "$$image" "$$api_upstream"
        gcloud run services describe uinventario-web --project="$PROJECT_ID" --region="${_REGION}" --format=json > /workspace/deployed-web-service.json

  - id: verify-scaling
    name: python:3.13-alpine
    entrypoint: python
    args:
      - deploy/verify-cloud-run-scaling.py
      - /workspace/deployed-web-service.json

substitutions:
  _DEPLOY_ENV: dev
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: uinventario

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
