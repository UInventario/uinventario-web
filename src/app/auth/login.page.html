<main class="login-shell">
  <section aria-labelledby="login-title">
    <div class="brand" aria-hidden="true">UI</div>
    @if (registrationComplete) {
      <p class="success" role="status">Tu cuenta y organización se crearon correctamente.</p>
    }
    <h1 id="login-title">Iniciar sesión</h1>
    <p>El acceso seguro se habilita en el siguiente incremento.</p>
    <a routerLink="/registro">Crear otra cuenta</a>
  </section>
</main>
