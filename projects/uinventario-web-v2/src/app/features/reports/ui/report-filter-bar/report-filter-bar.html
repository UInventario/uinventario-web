<form class="report-filters" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label for="reportDateFrom">Desde</label>
    <input id="reportDateFrom" type="date" formControlName="dateFrom" />
  </div>
  <div class="field">
    <label for="reportDateTo">Hasta</label>
    <input id="reportDateTo" type="date" formControlName="dateTo" />
  </div>
  @if (branches().length > 1) {
    <div class="field">
      <label for="reportBranch">Sucursal</label>
      <select id="reportBranch" formControlName="branchId">
        <option value="">Todas autorizadas</option>
        @for (branch of branches(); track branch.id) {
          <option [value]="branch.id">{{ branch.name }}</option>
        }
      </select>
    </div>
  }
  @if (registers().length) {
    <div class="field">
      <label for="reportRegister">Caja</label>
      <select id="reportRegister" formControlName="cashRegisterId">
        <option value="">Todas</option>
        @for (register of registers(); track register.id) {
          <option [value]="register.id">{{ register.name }} · {{ register.code }}</option>
        }
      </select>
    </div>
  }
  @if (users().length) {
    <div class="field">
      <label for="reportUser">Responsable</label>
      <select id="reportUser" formControlName="userId">
        <option value="">Todos</option>
        @for (user of users(); track user.id) {
          <option [value]="user.id">{{ user.email }}</option>
        }
      </select>
    </div>
  }
  @if (warehouses().length) {
    <div class="field">
      <label for="reportWarehouse">Bodega</label>
      <select id="reportWarehouse" formControlName="warehouseId">
        <option value="">Todas</option>
        @for (warehouse of warehouses(); track warehouse.id) {
          <option [value]="warehouse.id">{{ warehouse.branch.name }} · {{ warehouse.name }}</option>
        }
      </select>
    </div>
  }
  @if (categories().length) {
    <div class="field">
      <label for="reportCategory">Categoría</label>
      <select id="reportCategory" formControlName="categoryId">
        <option value="">Todas</option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>
  }
  @if (showProduct()) {
    <div class="field product-field">
      <label for="reportProduct">Producto</label>
      <input id="reportProduct" formControlName="product" placeholder="Nombre o SKU" />
    </div>
  }
  @if (showStatus()) {
    <div class="field">
      <label for="reportStatus">Estado</label>
      <select id="reportStatus" formControlName="status">
        <option value="ALL">Todos</option>
        <option value="COMPLETED">Completadas</option>
        <option value="VOIDED">Anuladas</option>
      </select>
    </div>
  }
  <div class="actions">
    <button class="secondary" type="button" (click)="reset()">Limpiar</button>
    <button class="primary" type="submit"><i class="pi pi-filter"></i>Aplicar</button>
  </div>
  @if (error()) {
    <div class="filter-error" role="alert">{{ error() }}</div>
  }
</form>
