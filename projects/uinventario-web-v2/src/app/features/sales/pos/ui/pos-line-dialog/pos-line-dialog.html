<div class="backdrop" (click)="closed.emit()">
  <section
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="line-editor-title"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <p>Editar línea</p>
        <h2 id="line-editor-title">{{ line().product.name }}</h2>
        <span>{{ line().product.sku }}</span>
      </div>
      <button class="icon" type="button" aria-label="Cerrar" (click)="closed.emit()">
        <i class="pi pi-times"></i>
      </button>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Cantidad
        <input formControlName="quantity" inputmode="decimal" autocomplete="off" />
        <small
          >Mínimo {{ line().product.minimumQuantity }} · máximo
          {{ line().product.quantityPrecision }} decimales</small
        >
      </label>
      <label>
        Nota de línea
        <input formControlName="note" maxlength="240" autocomplete="off" />
      </label>
      @if (canOverridePrice()) {
        <div class="override">
          <label>
            Precio manual
            <input formControlName="manualUnitPrice" inputmode="decimal" autocomplete="off" />
          </label>
          <label>
            Motivo del override
            <input formControlName="priceOverrideReason" maxlength="240" autocomplete="off" />
          </label>
          <p>El backend limita el precio manual entre 50% y 200% del vigente.</p>
        </div>
      }
      @if (error()) {
        <div class="notice" role="alert">{{ error() }}</div>
      }
      <footer>
        <button class="secondary" type="button" (click)="closed.emit()">Cancelar</button>
        <button class="primary" type="submit">Aplicar cambios</button>
      </footer>
    </form>
  </section>
</div>
