<section class="ribbon" [attr.aria-label]="ariaLabel()">
  <div class="ribbon-tabs" role="tablist" [attr.aria-label]="ariaLabel()">
    @for (tab of tabs(); track tab.id; let index = $index) {
      <button
        class="ribbon-tab"
        type="button"
        role="tab"
        [id]="'ribbon-tab-' + tab.id"
        [attr.aria-controls]="'ribbon-panel-' + tab.id"
        [attr.aria-selected]="activeTab()?.id === tab.id"
        [tabIndex]="activeTab()?.id === tab.id ? 0 : -1"
        (click)="selectTab(tab.id)"
        (keydown)="handleTabKeydown($event, index)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  @if (activeTab(); as tab) {
    <div
      class="ribbon-panel"
      role="tabpanel"
      [id]="'ribbon-panel-' + tab.id"
      [attr.aria-labelledby]="'ribbon-tab-' + tab.id"
      [attr.aria-label]="'Comandos de ' + tab.label + '. Desplaza horizontalmente para ver todos.'"
      tabindex="0"
    >
      @for (group of tab.groups; track group.id) {
        <section class="ribbon-group" [attr.aria-label]="group.label">
          <div class="ribbon-commands">
            @for (command of group.commands; track command.id) {
              <button
                pButton
                class="ribbon-command"
                type="button"
                [disabled]="command.disabled"
                [attr.aria-label]="command.label"
                [attr.title]="
                  command.shortcut ? command.label + ' · ' + command.shortcut : command.label
                "
                (click)="commandInvoked.emit(command.id)"
              >
                <i [class]="command.icon" aria-hidden="true"></i>
                <span>{{ command.label }}</span>
                @if (command.shortcut) {
                  <kbd>{{ command.shortcut }}</kbd>
                }
              </button>
            }
          </div>
          <span class="ribbon-group-label">{{ group.label }}</span>
        </section>
      }
    </div>
    <span class="ribbon-scroll-hint" aria-hidden="true">
      <i class="pi pi-arrows-h"></i>
      Desliza para ver más comandos
    </span>
  }
</section>
